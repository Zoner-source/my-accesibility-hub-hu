<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ben billentyűzete</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <main>
      <div class="textbar-container">
        <div id="textBar" class="textbar" aria-live="polite"></div>
      </div>

      <div id="keyboard" class="keyboard"></div>

      <div id="letterPredictBar" class="letterpredictbar"></div>

      <div id="predictBar" class="predictbar"></div>
    </main>
  </div>

  <!-- Settings menu overlay -->
  <div id="settingsMenu" class="settings-menu hidden">
    <div class="settings-header">
      <h2>Beállítások</h2>
      <div class="settings-instructions">
        <div class="instruction-row">
          <p><strong>Rövid szóköz:</strong> Előre</p>
          <p><strong>Hosszú szóköz:</strong> Vissza</p>
        </div>
        <div class="instruction-row">
          <p><strong>Rövid Enter:</strong> Kiválaszt</p>
          <p><strong>Hosszú Enter (gomb):</strong> Sor mód</p>
          <p><strong>Hosszú Enter (sor):</strong> Szójóslat</p>
        </div>
      </div>
    </div>
    <div id="settingsGrid" class="settings-grid">
      <button class="settings-item" data-setting="theme">
        <span class="setting-label">Téma</span>
        <span class="setting-value" id="themeValue">Alapértelmezett</span>
      </button>
      <button class="settings-item" data-setting="highlight">
        <span class="setting-label">Kiemelés</span>
        <span class="setting-value" id="highlightValue">Sárga</span>
      </button>
      <button class="settings-item" data-setting="voice">
        <span class="setting-label">Hang</span>
        <span class="setting-value" id="voiceValue">Alapértelmezett</span>
      </button>
      <button class="settings-item" data-setting="tts-toggle">
        <span class="setting-label">Hangvisszajelzés</span>
        <span class="setting-value" id="ttsToggleValue">Be</span>
      </button>
      <button class="settings-item" data-setting="scan-speed">
        <span class="setting-label">Pásztázási sebesség</span>
        <span class="setting-value" id="scanSpeedValue">Közepes</span>
      </button>
      <button class="settings-item" data-setting="auto-scan">
        <span class="setting-label">Automatikus pásztázás</span>
        <span class="setting-value" id="autoScanValue">Be</span>
      </button>
      <button class="settings-item" data-setting="volume-up">
        <span class="setting-label">Hangerő fel</span>
        <span class="setting-value">Hangerő növelése</span>
      </button>
      <button class="settings-item" data-setting="volume-down">
        <span class="setting-label">Hangerő le</span>
        <span class="setting-value">Hangerő csökkentése</span>
      </button>
      <button class="settings-item" data-setting="close">
        <span class="setting-label">Beállítások bezárása</span>
        <span class="setting-value">Kilépés a beállításokból<br><small style="font-size: 0.6em; opacity: 0.9; margin-top: 0.5em; display: block;">Tipp: mondja fel a szöveget 3-szor, hogy mentse az előrejelzésekbe</small></span>
      </button>
    </div>
  </div>

  <script>
    // Shared managers are loaded below - no inline initialization needed
    // Voice manager and scan manager self-initialize on load
  </script>
  
  <!-- Electron Bridge for iframe API access -->
  <script src="../../../shared/electron-bridge.js"></script>
  
  <!-- Shared Managers (Relative to apps/tools/keyboard-hu/) -->
  <script src="../../../shared/voice-manager.js"></script>
  <script src="../../../shared/ios-audio-fix.js"></script>
  <script src="../../../shared/scan-manager.js"></script>
  
  <script src="predictions.js"></script>
  <script src="app.js"></script>
</body>
</html>
